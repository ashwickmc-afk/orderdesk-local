name: OrderDesk checks

on:
  push:
  pull_request:

jobs:
  local-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build standalone app from source
        run: node apps/local/build-standalone.cjs
      - name: Verify committed standalone matches source build
        run: git diff --exit-code -- OrderDesk.html
      - name: Run Local app regression tests
        run: node --test apps/local/tests/*.test.cjs
      - name: Check source and generated JavaScript
        run: node tools/check-standalone.cjs
